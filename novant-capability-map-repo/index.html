<title>Novant Capability Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Brand palette sourced from the Novant Health EBRA v2.6 deck (executive title slide domain bands) */
    --paper:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F5F1F8;
    --ink:#1C1926;
    --slate:#5B5566;
    --slate-2:#847C90;
    --line:#E3DCEB;
    --line-soft:#EDE7F2;
    --accent:#8E44AD;
    --accent-ink:#FFFFFF;
    --accent-soft:#F0E1F6;
    --secondary:#5B2C6F;
    --secondary-ink:#FFFFFF;
    --secondary-soft:#EBE1F0;
    --dom-strategic:#5B2C6F;
    --dom-strategic-soft:#EBE1F0;
    --dom-care:#C2185B;
    --dom-care-soft:#FBE1EC;
    --dom-enterprise:#8E44AD;
    --dom-enterprise-soft:#F0E1F6;
    --good:#1E7D4F;
    --good-soft:#DFF1E6;
    --warn:#9A6B0C;
    --warn-soft:#F5EBD4;
    --crit:#A23B3B;
    --crit-soft:#F6E1E1;
    --neutral-soft:#F1EDF4;
    --focus:#8E44AD;
    --shadow: 0 1px 2px rgba(59,25,77,0.06), 0 8px 24px -12px rgba(59,25,77,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15121C;
      --surface:#1D1826;
      --surface-2:#251F2F;
      --ink:#EEE9F3;
      --slate:#B7ADC5;
      --slate-2:#8F869E;
      --line:#352C41;
      --line-soft:#2A2433;
      --accent:#CC93E0;
      --accent-ink:#1F1027;
      --accent-soft:#3A2A48;
      --secondary:#C9A0E0;
      --secondary-ink:#1F1027;
      --secondary-soft:#342640;
      --dom-strategic:#BC93D6;
      --dom-strategic-soft:#2E2438;
      --dom-care:#F095B8;
      --dom-care-soft:#3B222C;
      --dom-enterprise:#CC93E0;
      --dom-enterprise-soft:#332A3D;
      --good:#6FCB98;
      --good-soft:#173824;
      --warn:#E0B454;
      --warn-soft:#3A2F13;
      --crit:#E08080;
      --crit-soft:#3A1E1E;
      --neutral-soft:#251F2F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#15121C; --surface:#1D1826; --surface-2:#251F2F; --ink:#EEE9F3; --slate:#B7ADC5; --slate-2:#8F869E;
    --line:#352C41; --line-soft:#2A2433; --accent:#CC93E0; --accent-ink:#1F1027; --accent-soft:#3A2A48;
    --secondary:#C9A0E0; --secondary-ink:#1F1027; --secondary-soft:#342640;
    --dom-strategic:#BC93D6; --dom-strategic-soft:#2E2438; --dom-care:#F095B8; --dom-care-soft:#3B222C;
    --dom-enterprise:#CC93E0; --dom-enterprise-soft:#332A3D; --good:#6FCB98; --good-soft:#173824;
    --warn:#E0B454; --warn-soft:#3A2F13; --crit:#E08080; --crit-soft:#3A1E1E; --neutral-soft:#251F2F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    font-size:14px;
    line-height:1.5;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums;}
  h1,h2,h3,h4{font-family:'IBM Plex Sans', sans-serif; font-weight:600; margin:0; text-wrap:balance;}
  a{color:var(--accent);}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--accent-soft);}

  /* ---------- Header ---------- */
  header.topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:20px;
    padding:12px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);
    z-index:20;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:220px;}
  .brand-mark{
    flex:0 0 auto; background:var(--secondary); border-radius:8px; padding:7px 10px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-mark svg{display:block; height:19px; width:auto;}
  .brand-text{display:flex; flex-direction:column; gap:1px;}
  .brand .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--slate-2); font-weight:600;}
  .brand h1{font-size:17px;}
  .stats{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-chip{
    display:flex; flex-direction:column; align-items:flex-start;
    padding:5px 10px; border-radius:8px; background:var(--surface-2);
    border:1px solid var(--line-soft); min-width:64px;
  }
  .stat-chip b{font-size:15px; font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums;}
  .stat-chip span{font-size:10px; color:var(--slate-2); letter-spacing:.03em; text-transform:uppercase;}
  .spacer{flex:1;}
  .view-toggle{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:2px;}
  .view-toggle button{
    border:none; background:transparent; padding:7px 13px; border-radius:7px; font-size:13px; font-weight:500;
    color:var(--slate); transition:background .12s, color .12s;
  }
  .view-toggle button.active{background:var(--accent); color:var(--accent-ink);}
  .search-wrap{position:relative;}
  .search-wrap input{
    width:230px; padding:8px 12px 8px 30px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:13px; font-family:inherit;
  }
  .search-wrap input:focus{outline:2px solid var(--focus); outline-offset:1px;}
  .search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.55;}
  .role-pill{
    font-size:11px; font-weight:600; padding:5px 10px; border-radius:999px; letter-spacing:.02em;
    display:flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .role-pill.admin{background:var(--good-soft); color:var(--good);}
  .role-pill.view{background:var(--neutral-soft); color:var(--slate);}
  .icon-btn{
    border:1px solid var(--line); background:var(--surface-2); color:var(--slate); border-radius:8px;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- Main layout ---------- */
  main{flex:1; overflow:hidden; position:relative; display:flex;}
  .canvas{flex:1; overflow-y:auto; padding:20px 24px 60px;}
  .canvas::-webkit-scrollbar{width:10px;}
  .canvas::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

  .banner{
    display:flex; align-items:center; gap:10px; padding:9px 14px; border-radius:9px;
    background:var(--warn-soft); color:var(--warn); font-size:12.5px; margin-bottom:16px; border:1px solid transparent;
  }
  .banner.hidden{display:none;}

  /* ---------- Capability map view ---------- */
  .domain-band{margin-bottom:26px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface);}
  .domain-head{
    display:flex; align-items:center; gap:12px; padding:12px 18px;
    border-bottom:1px solid var(--line-soft);
  }
  .domain-dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto;}
  .domain-head h2{font-size:15px;}
  .domain-head .domain-def{font-size:12px; color:var(--slate); font-weight:400;}
  .domain-head .domain-count{margin-left:auto; font-size:11px; color:var(--slate-2); font-family:'IBM Plex Mono';}
  .domain-body{padding:14px 18px 18px;}

  .l1-group{margin-bottom:16px;}
  .l1-group:last-child{margin-bottom:0;}
  .l1-head{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .l1-head h3{font-size:13px; font-weight:600;}
  .l1-head .l1-id{font-size:10.5px; color:var(--slate-2); font-family:'IBM Plex Mono';}
  .l1-head .l1-owner{font-size:11px; color:var(--slate-2); margin-left:auto;}
  .l2-grid{display:flex; flex-wrap:wrap; gap:8px;}

  .l2-card{
    border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:168px; max-width:230px;
    background:var(--surface); cursor:pointer; transition:border-color .12s, transform .12s; position:relative;
    border-left-width:3px;
  }
  .l2-card:hover{border-color:var(--accent); transform:translateY(-1px);}
  .l2-card .l2-id{font-size:9.5px; color:var(--slate-2); font-family:'IBM Plex Mono'; letter-spacing:.02em;}
  .l2-card .l2-name{font-size:12.5px; font-weight:500; margin-top:2px; text-wrap:balance;}
  .l2-card .l2-meta{display:flex; align-items:center; gap:6px; margin-top:7px;}
  .heat{font-size:10px; font-family:'IBM Plex Mono'; font-weight:600; padding:1px 6px; border-radius:6px;}
  .l2-card.dim{opacity:.28; filter:grayscale(.4);}

  /* ---------- Layered view ---------- */
  .layer{
    border:1px solid var(--line); border-radius:14px; background:var(--surface); margin-bottom:16px; padding:14px 18px;
  }
  .layer-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate-2); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .layer-label .hint{text-transform:none; letter-spacing:0; font-weight:400; color:var(--slate-2); font-size:11px;}
  .l1-chip-row{display:flex; flex-wrap:wrap; gap:7px;}
  .l1-chip{
    border:1px solid var(--line); border-left-width:3px; border-radius:8px; padding:6px 11px; font-size:12px; background:var(--surface-2);
    display:flex; align-items:center; gap:7px;
  }
  .l1-chip.selected{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .l1-chip .n{font-family:'IBM Plex Mono'; font-size:10.5px; opacity:.75;}
  .connector{display:flex; justify-content:center; padding:2px 0 8px;}
  .connector svg{opacity:.5;}
  .app-chip-row{display:flex; flex-wrap:wrap; gap:7px; max-height:220px; overflow-y:auto;}
  .app-chip{
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; background:var(--surface-2);
    display:flex; align-items:center; gap:7px; cursor:pointer;
  }
  .app-chip:hover{border-color:var(--accent);}
  .status-dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .tech-chip-row{display:flex; flex-wrap:wrap; gap:7px;}
  .tech-chip{border:1px dashed var(--line); border-radius:999px; padding:5px 12px; font-size:11.5px; color:var(--slate);}
  .empty-note{color:var(--slate-2); font-size:12.5px; font-style:italic;}

  /* ---------- EA Framework diagram ---------- */
  .fw-frame{border:3px solid var(--ink); border-radius:16px; background:var(--surface); overflow:hidden;}
  .fw-title{padding:14px 20px; border-bottom:3px solid var(--ink); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .fw-title h2{font-size:18px;}
  .fw-title .sub{font-size:12px; color:var(--slate-2);}
  .fw-shell{display:flex; align-items:stretch;}
  .fw-main{flex:1; padding:16px 18px; display:flex; flex-direction:column; gap:14px; min-width:0;}
  .fw-rail{width:172px; flex:0 0 auto; border-left:3px solid var(--ink); padding:14px 12px; display:flex; flex-direction:column; gap:8px; background:var(--surface-2);}
  .fw-rail-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--slate); margin-bottom:2px;}
  .fw-rail-block{border:1.5px solid var(--ink); border-radius:7px; padding:7px 8px; font-size:11px; font-weight:600; text-align:center; background:var(--surface);}
  .fw-rail-block .n{display:block; font-family:'IBM Plex Mono'; font-size:14px; margin-top:2px;}
  .fw-layer{border:2px solid var(--ink); border-radius:10px; overflow:hidden;}
  .fw-layer-head{padding:8px 14px; font-weight:700; font-size:13.5px; border-bottom:2px solid var(--ink); display:flex; align-items:center; gap:10px; justify-content:space-between;}
  .fw-layer-head .cnt{font-size:10.5px; font-weight:500; color:var(--slate-2); font-family:'IBM Plex Mono';}
  .fw-layer-body{padding:10px 14px; display:flex; flex-wrap:wrap; gap:7px;}
  .fw-domain-sub{width:100%; margin-bottom:2px;}
  .fw-domain-sub .lbl{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-2); margin:6px 0 6px;}
  .fw-block{border:1.5px solid var(--ink); border-radius:6px; padding:6px 10px; font-size:11px; font-weight:600; cursor:pointer; line-height:1.25; transition:transform .1s;}
  .fw-block:hover{transform:translateY(-1px);}
  .fw-stat-block{border:1.5px solid var(--ink); border-radius:6px; padding:7px 12px; font-size:11px; font-weight:600; text-align:center; background:var(--surface-2); cursor:default;}
  .fw-stat-block[data-jump]{cursor:pointer;}
  .fw-stat-block[data-jump]:hover{border-color:var(--accent);}
  .fw-stat-block .n{display:block; font-family:'IBM Plex Mono'; font-size:16px;}
  .fw-legend{display:flex; flex-wrap:wrap; gap:12px; padding:10px 20px; border-top:2px solid var(--ink); font-size:11px;}
  .fw-legend-item{display:flex; align-items:center; gap:6px;}
  .fw-legend-swatch{width:13px; height:13px; border-radius:3px; border:1.5px solid var(--ink); flex:0 0 auto;}

  /* ---------- Drawer ---------- */
  .drawer-backdrop{
    position:absolute; inset:0; background:rgba(10,12,10,0.28); opacity:0; pointer-events:none; transition:opacity .16s; z-index:29;
  }
  .drawer-backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:absolute; top:0; right:0; bottom:0; width:400px; max-width:92vw; background:var(--surface);
    border-left:1px solid var(--line); box-shadow:var(--shadow); transform:translateX(100%); transition:transform .18s ease;
    z-index:30; display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:16px 18px 12px; border-bottom:1px solid var(--line-soft); display:flex; gap:10px; align-items:flex-start;}
  .drawer-head .crumb{font-size:10.5px; color:var(--slate-2); font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.03em;}
  .drawer-head h3{font-size:16px; margin-top:3px; text-wrap:balance;}
  .drawer-head .close{margin-left:auto;}
  .drawer-body{padding:14px 18px 24px; overflow-y:auto; flex:1;}
  .field-row{margin-bottom:14px;}
  .field-row label{display:block; font-size:11px; color:var(--slate-2); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; font-weight:600;}
  .field-row .value{font-size:13px;}
  .field-row textarea, .field-row select, .field-row input[type=text]{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
    color:var(--ink); font-family:inherit; font-size:13px;
  }
  .field-row textarea{min-height:56px; resize:vertical;}
  .pill{display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600;}
  .app-list-item{
    border:1px solid var(--line-soft); border-radius:9px; padding:8px 10px; margin-bottom:7px; cursor:pointer;
  }
  .app-list-item:hover{border-color:var(--accent);}
  .app-list-item .top{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; font-weight:500;}
  .app-list-item .sub{font-size:11px; color:var(--slate-2); margin-top:2px;}
  .save-row{display:flex; gap:8px; margin-top:16px;}
  .btn{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:500; color:var(--ink);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn:hover{border-color:var(--accent);}
  .btn:disabled{opacity:.5; cursor:default;}
  .save-msg{font-size:11.5px; margin-top:8px;}
  .save-msg.ok{color:var(--good);}
  .save-msg.err{color:var(--crit);}
  .divider{height:1px; background:var(--line-soft); margin:16px 0;}

  .footer-note{font-size:11px; color:var(--slate-2); text-align:center; padding:14px 0 4px;}

  @media (prefers-reduced-motion: reduce){
    .drawer, .drawer-backdrop, .l2-card{transition:none;}
  }
</style>

<script>
(function(){
  "use strict";

  var DOMAIN_COLOR = {
    "Strategic": {fg:"var(--dom-strategic)", bg:"var(--dom-strategic-soft)"},
    "Care Delivery": {fg:"var(--dom-care)", bg:"var(--dom-care-soft)"},
    "Enterprise Services": {fg:"var(--dom-enterprise)", bg:"var(--dom-enterprise-soft)"}
  };
  var STATUS_COLOR = {
    "In Production": "var(--good)",
    "Pilot": "var(--dom-strategic)",
    "Pending Install": "var(--warn)",
    "Pending Decommission": "var(--warn)",
    "Retired": "var(--slate-2)"
  };
  // Capability Type buckets (from the Master Capabilities "Capability Type" column),
  // used as the color legend on the EA Framework diagram.
  var TYPE_BUCKETS = {
    governance: {label:"Governance", fg:"var(--dom-strategic)", bg:"var(--dom-strategic-soft)"},
    regulatory: {label:"Regulatory", fg:"var(--crit)", bg:"var(--crit-soft)"},
    core:       {label:"Core (Strategic / Care)", fg:"var(--good)", bg:"var(--good-soft)"},
    oversight:  {label:"Oversight / Analytical", fg:"var(--warn)", bg:"var(--warn-soft)"},
    enabling:   {label:"Enabling", fg:"var(--dom-care)", bg:"var(--dom-care-soft)"}
  };
  function typeBucket(rawType){
    var t = rawType || "";
    if (t.indexOf("Governance") !== -1) return "governance";
    if (t.indexOf("Regulatory") !== -1) return "regulatory";
    if (t.indexOf("Core") !== -1) return "core";
    if (t.indexOf("Oversight") !== -1 || t.indexOf("Analytical") !== -1) return "oversight";
    if (t.indexOf("Enabling") !== -1) return "enabling";
    return "core";
  }

  var state = {
    capabilities: [],   // array of capability docs
    applications: [],   // array of application docs (mapped/in-scope)
    unmapped: [],        // array of unmapped app entries
    techStandards: [],
    view: "map",
    search: "",
    selectedL1: null,   // for layered view drill-down
    selected: null,     // {type, id} for drawer
    loadError: false    // true if the initial /api/data fetch failed
  };

  function byId(arr, key){ var m = {}; arr.forEach(function(x){ m[x[key]] = x; }); return m; }
  function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }

  // ---------------- data loading ----------------
  function loadData(){
    return fetch("/api/data").then(function(r){
      if (!r.ok) throw new Error("api-error");
      return r.json();
    }).then(function(res){
      state.capabilities = res.capabilities || [];
      state.applications = res.applications || [];
      state.unmapped = res.unmapped || [];
      state.techStandards = res.techStandards || [];
      state.loadError = false;
    }).catch(function(e){
      console.warn("failed to load /api/data", e);
      state.loadError = true;
    });
  }

  function apiPatch(resource, id, patch){
    return fetch("/api/" + resource + "/" + encodeURIComponent(id), {
      method: "PATCH",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(patch)
    }).then(function(r){
      if (!r.ok) throw new Error("save-failed");
      return r.json();
    });
  }

  function apiAssign(unmappedItem, primaryCapabilityId){
    return fetch("/api/assign", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({unmapped: unmappedItem, primaryCapabilityId: primaryCapabilityId})
    }).then(function(r){
      if (!r.ok) throw new Error("assign-failed");
      return r.json();
    });
  }

  // ---------------- derived data ----------------
  function domainOrder(){
    var seen = [], out = [];
    state.capabilities.forEach(function(c){ if (seen.indexOf(c.l0Domain) === -1){ seen.push(c.l0Domain); out.push({domain:c.l0Domain, def:c.l0Definition}); } });
    return out;
  }
  function l1Groups(domain){
    var map = {}, order = [];
    state.capabilities.filter(function(c){ return c.l0Domain === domain; }).forEach(function(c){
      if (!map[c.l1Id]){ map[c.l1Id] = {l1Id:c.l1Id, l1Name:c.l1Name, l1Definition:c.l1Definition, owner:c.owner, items:[]}; order.push(c.l1Id); }
      map[c.l1Id].items.push(c);
    });
    return order.map(function(id){ return map[id]; });
  }
  function appsForCapability(l2Id){
    return state.applications.filter(function(a){ return a.primaryCapabilityId === l2Id; });
  }
  function appsForL1(l1Id){
    var l2ids = state.capabilities.filter(function(c){ return c.l1Id === l1Id; }).map(function(c){ return c.l2Id; });
    return state.applications.filter(function(a){ return l2ids.indexOf(a.primaryCapabilityId) !== -1; });
  }
  function heatColor(n){
    if (n === 0) return {fg:"var(--slate-2)", bg:"var(--neutral-soft)"};
    if (n <= 2) return {fg:"var(--accent)", bg:"var(--accent-soft)"};
    if (n <= 6) return {fg:"var(--good)", bg:"var(--good-soft)"};
    return {fg:"var(--warn)", bg:"var(--warn-soft)"};
  }
  function matchesSearch(text){
    if (!state.search) return true;
    return (text || "").toLowerCase().indexOf(state.search) !== -1;
  }
  function capMatches(c){
    return matchesSearch(c.l2Name) || matchesSearch(c.l1Name) || matchesSearch(c.l2Id) || matchesSearch(c.owner) || matchesSearch(c.l0Domain);
  }
  function appMatches(a){
    return matchesSearch(a.name) || matchesSearch(a.vendor) || matchesSearch(a.businessOwner) || matchesSearch(a.apmNumber) || matchesSearch(a.novantName);
  }
  // Retired / on their way out apps have no forward capability need — mapping them provides
  // no EA value, so they're tracked separately from apps that genuinely need a capability assigned.
  function isRetiredStatus(status){
    return status === "Retired" || status === "Pending Decommission";
  }
  function needsMappingApps(){
    return state.unmapped.filter(function(a){ return !isRetiredStatus(a.installStatus); });
  }
  function retiredUnmappedApps(){
    return state.unmapped.filter(function(a){ return isRetiredStatus(a.installStatus); });
  }

  // ---------------- rendering: stats ----------------
  function renderStats(){
    var l1count = {}; state.capabilities.forEach(function(c){ l1count[c.l1Id]=1; });
    var l2WithApps = 0; state.capabilities.forEach(function(c){ if (appsForCapability(c.l2Id).length>0) l2WithApps++; });
    var coverage = state.capabilities.length ? Math.round(100*l2WithApps/state.capabilities.length) : 0;
    var stats = [
      {n: Object.keys(l1count).length, label:"L1 groups"},
      {n: state.capabilities.length, label:"L2 capabilities"},
      {n: state.applications.length, label:"apps mapped"},
      {n: needsMappingApps().length, label:"apps need mapping"},
      {n: coverage + "%", label:"coverage"}
    ];
    document.getElementById("statsRow").innerHTML = stats.map(function(s){
      return '<div class="stat-chip"><b>'+esc(s.n)+'</b><span>'+esc(s.label)+'</span></div>';
    }).join("");
  }

  // ---------------- rendering: capability map ----------------
  function renderMapView(){
    var html = "";
    domainOrder().forEach(function(d){
      var col = DOMAIN_COLOR[d.domain] || {fg:"var(--accent)", bg:"var(--accent-soft)"};
      var groups = l1Groups(d.domain);
      var domainAppCount = 0;
      groups.forEach(function(g){ g.items.forEach(function(c){ domainAppCount += appsForCapability(c.l2Id).length; }); });
      html += '<section class="domain-band">';
      html += '<div class="domain-head"><span class="domain-dot" style="background:'+col.fg+'"></span>';
      html += '<h2>'+esc(d.domain)+'</h2><span class="domain-def">'+esc(d.def)+'</span>';
      html += '<span class="domain-count">'+groups.length+' L1 &middot; '+domainAppCount+' apps</span></div>';
      html += '<div class="domain-body">';
      groups.forEach(function(g){
        var visibleItems = g.items.filter(function(c){ return capMatches(c) || appsForCapability(c.l2Id).some(appMatches); });
        if (state.search && visibleItems.length === 0) return;
        html += '<div class="l1-group"><div class="l1-head"><h3>'+esc(g.l1Name)+'</h3><span class="l1-id mono">'+esc(g.l1Id)+'</span><span class="l1-owner">'+esc(g.owner||"")+'</span></div>';
        html += '<div class="l2-grid">';
        g.items.forEach(function(c){
          var apps = appsForCapability(c.l2Id);
          var heat = heatColor(apps.length);
          var dim = state.search && !(capMatches(c) || apps.some(appMatches));
          html += '<div class="l2-card'+(dim?' dim':'')+'" data-type="capability" data-id="'+esc(c.l2Id)+'" style="border-left-color:'+col.fg+'">';
          html += '<div class="l2-id">'+esc(c.l2Id)+'</div><div class="l2-name">'+esc(c.l2Name)+'</div>';
          html += '<div class="l2-meta"><span class="heat" style="color:'+heat.fg+';background:'+heat.bg+'">'+apps.length+' app'+(apps.length===1?"":"s")+'</span></div>';
          html += '</div>';
        });
        html += '</div></div>';
      });
      html += '</div></section>';
    });
    return html;
  }

  // ---------------- rendering: layered view ----------------
  function renderLayeredView(){
    var l1s = [];
    domainOrder().forEach(function(d){ l1Groups(d.domain).forEach(function(g){ l1s.push({domain:d.domain, g:g}); }); });
    if (!state.selectedL1 && l1s.length) state.selectedL1 = l1s[0].g.l1Id;

    var html = '<div class="layer"><div class="layer-label">Business Capabilities <span class="hint">&mdash; click an L1 group to trace its apps and technology</span></div>';
    html += '<div class="l1-chip-row">';
    l1s.forEach(function(item){
      var col = DOMAIN_COLOR[item.domain] || {fg:"var(--accent)"};
      var sel = item.g.l1Id === state.selectedL1;
      var count = appsForL1(item.g.l1Id).length;
      html += '<div class="l1-chip'+(sel?" selected":"")+'" data-l1="'+esc(item.g.l1Id)+'" style="border-left-color:'+col.fg+'">'+esc(item.g.l1Name)+' <span class="n">'+count+'</span></div>';
    });
    html += '</div></div>';

    html += '<div class="connector"><svg width="24" height="20" viewBox="0 0 24 20"><path d="M12 0v20M6 14l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>';

    var apps = state.selectedL1 ? appsForL1(state.selectedL1) : [];
    html += '<div class="layer"><div class="layer-label">Applications <span class="hint">&mdash; '+apps.length+' supporting this capability group</span></div>';
    if (apps.length){
      html += '<div class="app-chip-row">';
      apps.forEach(function(a){
        var sc = STATUS_COLOR[a.installStatus] || "var(--slate-2)";
        html += '<div class="app-chip" data-type="application" data-id="'+esc(a.apmNumber)+'"><span class="status-dot" style="background:'+sc+'"></span>'+esc(a.name)+'</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-note">No applications mapped to this capability group yet.</div>';
    }
    html += '</div>';

    html += '<div class="connector"><svg width="24" height="20" viewBox="0 0 24 20"><path d="M12 0v20M6 14l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>';

    var techCounts = {};
    apps.forEach(function(a){ if (a.trmCategory){ techCounts[a.trmCategory] = (techCounts[a.trmCategory]||0)+1; } });
    var techKeys = Object.keys(techCounts);
    html += '<div class="layer"><div class="layer-label">Technology <span class="hint">&mdash; TRM categories tagged on the apps above</span></div>';
    if (techKeys.length){
      html += '<div class="tech-chip-row">';
      techKeys.forEach(function(k){ html += '<div class="tech-chip">'+esc(k)+' &middot; '+techCounts[k]+'</div>'; });
      html += '</div>';
    } else {
      html += '<div class="empty-note">No technology tags yet. Open an application below and assign a Technology Reference Model category &mdash; it will appear here.</div>';
    }
    html += '</div>';
    return html;
  }

  // ---------------- rendering: unmapped ----------------
  function unmappedTableRows(rows, showAssign){
    var html = '<div style="overflow-x:auto"><table style="width:100%; border-collapse:collapse; font-size:12.5px;">';
    html += '<thead><tr style="text-align:left; color:var(--slate-2); font-size:11px; text-transform:uppercase; letter-spacing:.03em;">'+
            '<th style="padding:6px 8px;">App</th><th style="padding:6px 8px;">Vendor</th><th style="padding:6px 8px;">Status</th><th style="padding:6px 8px;">Owner</th><th style="padding:6px 8px;"></th></tr></thead><tbody>';
    rows.forEach(function(a){
      var sc = STATUS_COLOR[a.installStatus] || "var(--slate-2)";
      html += '<tr style="border-top:1px solid var(--line-soft);">'+
        '<td style="padding:7px 8px;">'+esc(a.name)+'<div class="mono" style="font-size:10px;color:var(--slate-2)">'+esc(a.apmNumber)+'</div></td>'+
        '<td style="padding:7px 8px;">'+esc(a.vendor||"&mdash;")+'</td>'+
        '<td style="padding:7px 8px;"><span class="status-dot" style="background:'+sc+';display:inline-block;margin-right:5px;"></span>'+esc(a.installStatus||"&mdash;")+'</td>'+
        '<td style="padding:7px 8px;">'+esc(a.businessOwner||"&mdash;")+'</td>'+
        '<td style="padding:7px 8px; text-align:right;">'+(showAssign ? '<button class="btn assign-btn" data-apm="'+esc(a.apmNumber)+'">Assign capability</button>' : '')+'</td>'+
        '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderUnmappedView(){
    var searchFilter = function(a){ return matchesSearch(a.name) || matchesSearch(a.vendor) || matchesSearch(a.businessOwner) || matchesSearch(a.apmNumber); };
    var active = needsMappingApps().filter(searchFilter);
    var retired = retiredUnmappedApps().filter(searchFilter);

    var html = '<div class="layer"><div class="layer-label">Needs mapping <span class="hint">&mdash; '+needsMappingApps().length+' active app(s) in the CMDB with no capability assigned yet</span></div>';
    html += active.length ? unmappedTableRows(active, true) : '<div class="empty-note">Nothing to show.</div>';
    html += '</div>';

    html += '<div class="layer"><details'+(retired.length && state.search ? ' open' : '')+'><summary style="cursor:pointer; list-style:none;"><div class="layer-label" style="display:inline-flex;">Retired / decommissioned <span class="hint">&mdash; '+retired.length+' app(s) no longer in use &mdash; no capability mapping needed</span></div></summary>';
    html += '<div style="margin-top:10px;">'+(retired.length ? unmappedTableRows(retired, false) : '<div class="empty-note">Nothing to show.</div>')+'</div>';
    html += '</details></div>';

    return html;
  }

  // ---------------- rendering: EA Framework diagram ----------------
  function l1DominantBucket(l1Id){
    var counts = {};
    state.capabilities.filter(function(c){ return c.l1Id === l1Id; }).forEach(function(c){
      var b = typeBucket(c.capabilityType); counts[b] = (counts[b]||0)+1;
    });
    var best = "core", bestN = -1;
    Object.keys(counts).forEach(function(k){ if (counts[k] > bestN){ best = k; bestN = counts[k]; } });
    return best;
  }
  function mostCommon(arr){
    var counts = {}, best = null, bestN = 0;
    arr.forEach(function(v){ if(!v) return; counts[v] = (counts[v]||0)+1; if (counts[v] > bestN){ bestN = counts[v]; best = v; } });
    return best;
  }
  function techParentCounts(){
    var counts = {};
    state.techStandards.forEach(function(t){ if (t.parentCategory){ counts[t.parentCategory] = (counts[t.parentCategory]||0)+1; } });
    return Object.keys(counts).map(function(k){ return {name:k, n:counts[k]}; }).sort(function(a,b){ return b.n - a.n; });
  }

  function renderFrameworkView(){
    var domains = domainOrder();
    var l1CountSet = {}; state.capabilities.forEach(function(c){ l1CountSet[c.l1Id]=1; });
    var totalL1 = Object.keys(l1CountSet).length;
    var inProd = state.applications.filter(function(a){ return a.installStatus === "In Production"; }).length;
    var retired = state.applications.filter(function(a){ return a.installStatus === "Retired"; }).length;
    var topVendor = mostCommon(state.applications.map(function(a){ return a.vendor; }));
    var vendorCount = topVendor ? state.applications.filter(function(a){ return a.vendor === topVendor; }).length : 0;
    var techParents = techParentCounts();
    var coverage = state.capabilities.length ? Math.round(100 * state.capabilities.filter(function(c){ return appsForCapability(c.l2Id).length>0; }).length / state.capabilities.length) : 0;

    var html = '<div class="fw-frame">';
    html += '<div class="fw-title"><h2>Novant Health &mdash; Enterprise Architecture</h2><span class="sub">Business capabilities, applications and technology, drawn from the NHBCM v2.6 taxonomy and CMDB</span></div>';
    html += '<div class="fw-shell"><div class="fw-main">';

    // Business Architecture layer: one sub-band per L0 domain, L1s as blocks
    html += '<div class="fw-layer"><div class="fw-layer-head"><span>Business Architecture</span><span class="cnt">'+totalL1+' L1 groups &middot; '+state.capabilities.length+' L2 capabilities</span></div><div class="fw-layer-body">';
    domains.forEach(function(d){
      html += '<div class="fw-domain-sub"><div class="lbl">'+esc(d.domain)+'</div><div style="display:flex;flex-wrap:wrap;gap:7px;">';
      l1Groups(d.domain).forEach(function(g){
        var bucket = TYPE_BUCKETS[l1DominantBucket(g.l1Id)];
        html += '<div class="fw-block" data-l1name="'+esc(g.l1Name)+'" style="background:'+bucket.bg+'; color:'+bucket.fg+'; border-color:'+bucket.fg+'" title="'+esc(g.l1Id)+' &mdash; '+appsForL1(g.l1Id).length+' supporting app(s)">'+esc(g.l1Name)+'</div>';
      });
      html += '</div></div>';
    });
    html += '</div></div>';

    // Application Architecture layer: summary stat blocks
    var needsMappingCount = needsMappingApps().length;
    html += '<div class="fw-layer"><div class="fw-layer-head"><span>Application Architecture</span><span class="cnt">'+state.applications.length+' mapped &middot; '+needsMappingCount+' need mapping</span></div><div class="fw-layer-body">';
    html += '<div class="fw-stat-block" data-jump="map"><span class="n">'+state.applications.length+'</span>Apps mapped to capabilities</div>';
    html += '<div class="fw-stat-block" data-jump="unmapped"><span class="n">'+needsMappingCount+'</span>Apps needing capability mapping</div>';
    html += '<div class="fw-stat-block"><span class="n">'+inProd+'</span>In production</div>';
    html += '<div class="fw-stat-block"><span class="n">'+retired+'</span>Retired</div>';
    html += '<div class="fw-stat-block"><span class="n">'+coverage+'%</span>L2 capability coverage</div>';
    if (topVendor) html += '<div class="fw-stat-block"><span class="n">'+vendorCount+'</span>Top vendor: '+esc(topVendor)+'</div>';
    html += '</div></div>';

    // Technology Architecture layer: TRM parent categories
    html += '<div class="fw-layer"><div class="fw-layer-head"><span>Technology Architecture</span><span class="cnt">'+techParents.length+' TRM categories &middot; '+state.techStandards.length+' sub-categories</span></div><div class="fw-layer-body">';
    if (techParents.length){
      techParents.forEach(function(p){
        html += '<div class="fw-block" style="background:var(--neutral-soft); color:var(--slate); border-color:var(--line);" title="'+p.n+' sub-categor'+(p.n===1?'y':'ies')+'">'+esc(p.name)+' <span class="mono" style="opacity:.6">&middot; '+p.n+'</span></div>';
      });
    } else {
      html += '<div class="empty-note">No Technology Reference Model categories loaded.</div>';
    }
    html += '</div></div>';

    html += '</div>'; // fw-main

    // Right rail: coverage stats + legend glossary
    html += '<div class="fw-rail">';
    html += '<div class="fw-rail-title">At a glance</div>';
    html += '<div class="fw-rail-block">'+domains.length+' domains<span class="n">L0</span></div>';
    html += '<div class="fw-rail-block">'+totalL1+' groups<span class="n">L1</span></div>';
    html += '<div class="fw-rail-block">'+state.capabilities.length+' capabilities<span class="n">L2</span></div>';
    html += '<div class="fw-rail-block">'+coverage+'%<span class="n">mapped</span></div>';
    html += '</div>';
    html += '</div>'; // fw-shell

    html += '<div class="fw-legend">';
    Object.keys(TYPE_BUCKETS).forEach(function(k){
      var b = TYPE_BUCKETS[k];
      html += '<div class="fw-legend-item"><span class="fw-legend-swatch" style="background:'+b.bg+';border-color:'+b.fg+'"></span>'+b.label+'</div>';
    });
    html += '</div>';
    html += '</div>'; // fw-frame
    return html;
  }

  function render(){
    renderStats();
    var canvas = document.getElementById("canvas");
    var readonlyBanner = (state.loadError === true) ? '<div class="banner"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>Couldn&rsquo;t load live data from the server. Check your connection and reload the page.</div>' : "";
    var body = "";
    if (state.view === "map") body = renderMapView();
    else if (state.view === "layered") body = renderLayeredView();
    else if (state.view === "framework") body = renderFrameworkView();
    else body = renderUnmappedView();
    canvas.innerHTML = readonlyBanner + body;
    wireCanvasEvents();
  }

  function wireCanvasEvents(){
    Array.prototype.forEach.call(document.querySelectorAll(".l2-card"), function(el){
      el.addEventListener("click", function(){ openDetail("capability", el.getAttribute("data-id")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".app-chip"), function(el){
      el.addEventListener("click", function(){ openDetail("application", el.getAttribute("data-id")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".l1-chip"), function(el){
      el.addEventListener("click", function(){ state.selectedL1 = el.getAttribute("data-l1"); render(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".assign-btn"), function(el){
      el.addEventListener("click", function(){ openAssignFlow(el.getAttribute("data-apm")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".fw-block[data-l1name]"), function(el){
      el.addEventListener("click", function(){
        state.search = el.getAttribute("data-l1name").toLowerCase();
        document.getElementById("searchInput").value = el.getAttribute("data-l1name");
        state.view = "map";
        Array.prototype.forEach.call(document.querySelectorAll("#viewToggle button"), function(b){ b.classList.toggle("active", b.getAttribute("data-view") === "map"); });
        render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".fw-stat-block[data-jump]"), function(el){
      el.addEventListener("click", function(){
        var v = el.getAttribute("data-jump");
        state.view = v;
        Array.prototype.forEach.call(document.querySelectorAll("#viewToggle button"), function(b){ b.classList.toggle("active", b.getAttribute("data-view") === v); });
        render();
      });
    });
  }

  // ---------------- drawer ----------------
  function openDrawer(){ document.getElementById("drawer").classList.add("open"); document.getElementById("drawerBackdrop").classList.add("open"); }
  function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("drawerBackdrop").classList.remove("open"); state.selected=null; }
  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeDrawer(); });

  function trmOptions(selected){
    var opts = '<option value="">&mdash; none &mdash;</option>';
    state.techStandards.forEach(function(t){
      opts += '<option value="'+esc(t.name)+'"'+(t.name===selected?" selected":"")+'>'+esc(t.name)+'</option>';
    });
    return opts;
  }
  function capOptions(selected){
    var opts = "";
    state.capabilities.forEach(function(c){
      opts += '<option value="'+esc(c.l2Id)+'"'+(c.l2Id===selected?" selected":"")+'>'+esc(c.l2Id)+' &mdash; '+esc(c.l2Name)+'</option>';
    });
    return opts;
  }

  function openDetail(type, id){
    state.selected = {type:type, id:id};
    if (type === "capability") renderCapabilityDrawer(id); else renderApplicationDrawer(id);
    openDrawer();
  }

  function renderCapabilityDrawer(l2Id){
    var c = state.capabilities.filter(function(x){ return x.l2Id === l2Id; })[0];
    if (!c) return;
    var apps = appsForCapability(l2Id);
    document.getElementById("drawerCrumb").textContent = c.l0Domain + " / " + c.l1Name;
    document.getElementById("drawerTitle").textContent = c.l2Name;
    var html = "";
    html += '<div class="field-row"><label>Capability code</label><div class="value mono">'+esc(c.l2Id)+'</div></div>';
    html += '<div class="field-row"><label>Definition</label><div class="value">'+esc(c.l2Definition||"")+'</div></div>';
    html += '<div class="field-row"><label>Capability type</label><div class="value">'+esc(c.capabilityType||"")+'</div></div>';
    html += '<div class="field-row"><label>Owner</label><input type="text" id="editOwner" value="'+esc(c.owner||"")+'"></div>';
    html += '<div class="field-row"><label>Notes</label><textarea id="editNotes" placeholder="Add EA notes for this capability&hellip;">'+esc(c.notes||"")+'</textarea></div>';
    html += '<div class="save-row"><button class="btn primary" id="saveBtn">Save changes</button></div><div class="save-msg" id="saveMsg"></div>';
    html += '<div class="divider"></div>';
    html += '<div class="field-row"><label>Supporting applications ('+apps.length+')</label></div>';
    if (apps.length){
      apps.sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); }).forEach(function(a){
        html += '<div class="app-list-item" data-type="application" data-id="'+esc(a.apmNumber)+'"><div class="top"><span>'+esc(a.name)+'</span><span class="pill" style="background:var(--neutral-soft);color:var(--slate)">'+esc(a.installStatus||"")+'</span></div>'+
          '<div class="sub">'+esc(a.vendor||"")+' &middot; confidence: '+esc(a.reviewerConfidence||"n/a")+'</div></div>';
      });
    } else {
      html += '<div class="empty-note">No applications mapped yet.</div>';
    }
    document.getElementById("drawerBody").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll("#drawerBody .app-list-item"), function(el){
      el.addEventListener("click", function(){ openDetail("application", el.getAttribute("data-id")); });
    });
    document.getElementById("saveBtn").addEventListener("click", function(){
      var patch = { owner: document.getElementById("editOwner").value, notes: document.getElementById("editNotes").value };
      var msg = document.getElementById("saveMsg");
      apiPatch("capabilities", c.l2Id, patch).then(function(){
        Object.assign(c, patch); msg.className="save-msg ok"; msg.textContent="Saved."; renderStats();
      }).catch(function(err){
        msg.className="save-msg err";
        msg.textContent = "Couldn’t save — please try again.";
      });
    });
  }

  function renderApplicationDrawer(apm){
    var a = state.applications.filter(function(x){ return x.apmNumber === apm; })[0];
    if (!a) return;
    var cap = state.capabilities.filter(function(c){ return c.l2Id === a.primaryCapabilityId; })[0];
    document.getElementById("drawerCrumb").textContent = a.apmNumber;
    document.getElementById("drawerTitle").textContent = a.name;
    var html = "";
    html += '<div class="field-row"><label>Vendor</label><div class="value">'+esc(a.vendor||"&mdash;")+'</div></div>';
    html += '<div class="field-row"><label>Install status</label><div class="value">'+esc(a.installStatus||"&mdash;")+'</div></div>';
    html += '<div class="field-row"><label>Business need</label><div class="value">'+esc(a.businessNeed||"&mdash;")+'</div></div>';
    html += '<div class="field-row"><label>Business owner</label><div class="value">'+esc(a.businessOwner||"&mdash;")+'</div></div>';
    html += '<div class="field-row"><label>DR tier</label><div class="value">'+esc(a.drTier||"&mdash;")+'</div></div>';
    html += '<div class="field-row"><label>Mapping confidence</label><div class="value">'+esc(a.reviewerConfidence||"&mdash;")+' &mdash; '+esc(a.reviewerRationale||"")+'</div></div>';
    html += '<div class="divider"></div>';
    html += '<div class="field-row"><label>Primary capability</label><select id="editCap">'+capOptions(a.primaryCapabilityId)+'</select></div>';
    html += '<div class="field-row"><label>Technology category (TRM)</label><select id="editTrm">'+trmOptions(a.trmCategory)+'</select></div>';
    html += '<div class="field-row"><label>Notes</label><textarea id="editNotes" placeholder="Add EA notes for this application&hellip;">'+esc(a.notes||"")+'</textarea></div>';
    html += '<div class="save-row"><button class="btn primary" id="saveBtn">Save changes</button></div><div class="save-msg" id="saveMsg"></div>';
    document.getElementById("drawerBody").innerHTML = html;
    document.getElementById("saveBtn").addEventListener("click", function(){
      var patch = { primaryCapabilityId: document.getElementById("editCap").value, trmCategory: document.getElementById("editTrm").value || null, notes: document.getElementById("editNotes").value };
      var msg = document.getElementById("saveMsg");
      apiPatch("applications", a.apmNumber, patch).then(function(){
        Object.assign(a, patch); msg.className="save-msg ok"; msg.textContent="Saved."; render();
      }).catch(function(err){
        msg.className="save-msg err";
        msg.textContent = "Couldn’t save — please try again.";
      });
    });
  }

  function openAssignFlow(apm){
    var u = state.unmapped.filter(function(x){ return x.apmNumber === apm; })[0];
    if (!u) return;
    state.selected = {type:"unmapped", id:apm};
    document.getElementById("drawerCrumb").textContent = u.apmNumber + " · unmapped";
    document.getElementById("drawerTitle").textContent = u.name;
    var html = "";
    html += '<div class="field-row"><label>Vendor</label><div class="value">'+esc(u.vendor||"&mdash;")+'</div></div>';
    html += '<div class="field-row"><label>Install status</label><div class="value">'+esc(u.installStatus||"&mdash;")+'</div></div>';
    html += '<div class="field-row"><label>Owner</label><div class="value">'+esc(u.businessOwner||"&mdash;")+'</div></div>';
    html += '<div class="divider"></div>';
    html += '<div class="field-row"><label>Assign primary capability</label><select id="assignCap"><option value="">&mdash; choose &mdash;</option>'+capOptions(null)+'</select></div>';
    html += '<div class="save-row"><button class="btn primary" id="assignBtn" disabled>Assign &amp; move to mapped</button></div><div class="save-msg" id="saveMsg"></div>';
    document.getElementById("drawerBody").innerHTML = html;
    var sel = document.getElementById("assignCap"), btn = document.getElementById("assignBtn");
    sel.addEventListener("change", function(){ btn.disabled = !sel.value; });
    btn.addEventListener("click", function(){
      var l2Id = sel.value; var msg = document.getElementById("saveMsg");
      if (!l2Id) return;
      btn.disabled = true;
      apiAssign(u, l2Id).then(function(newApp){
        state.applications.push(newApp);
        state.unmapped = state.unmapped.filter(function(x){ return x.apmNumber !== u.apmNumber; });
        msg.className="save-msg ok"; msg.textContent="Assigned."; render(); closeDrawer();
      }).catch(function(err){
        btn.disabled = false;
        msg.className="save-msg err";
        msg.textContent = "Couldn’t save — please try again.";
      });
    });
    openDrawer();
  }

  // ---------------- chrome events ----------------
  document.getElementById("viewToggle").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-view]"); if (!btn) return;
    Array.prototype.forEach.call(document.querySelectorAll("#viewToggle button"), function(b){ b.classList.remove("active"); });
    btn.classList.add("active"); state.view = btn.getAttribute("data-view"); render();
  });
  var searchDebounce;
  document.getElementById("searchInput").addEventListener("input", function(e){
    clearTimeout(searchDebounce);
    var v = e.target.value;
    searchDebounce = setTimeout(function(){ state.search = v.trim().toLowerCase(); render(); }, 120);
  });
  document.getElementById("exportBtn").addEventListener("click", function(){
    var payload = { capabilities: state.capabilities, applications: state.applications, unmapped: state.unmapped, techStandards: state.techStandards, exportedAt: new Date().toISOString() };
    var text = JSON.stringify(payload, null, 2);
    fallbackDownload(text);
  });
  function fallbackDownload(text){
    try {
      var blob = new Blob([text], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a"); a.href = url; a.download = "novant-capability-map.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    } catch(e){ console.warn("download fallback failed", e); }
  }

  // ---------------- boot ----------------
  loadData().then(function(){
    render();
  });
})();
</script>
